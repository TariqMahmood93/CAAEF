# CAAEF experiment — model configuration
#
# Approved by the author on 2026-10-08.
#
# Access route: OpenRouter (https://openrouter.ai/api/v1).
#   This is a DEVIATION from the experiment prompt, which asked for each provider's
#   native API. Reason: the Anthropic first-party key authenticates but has zero credit,
#   so no native Anthropic call succeeds. The author supplied an OpenRouter key instead.
#   Recorded as a limitation: the paper reports routed models, not first-party ones.
#   Side effect, in our favour: routing through OpenRouter also resolves two harness
#   breakages (temperature=0 rejection and the function-tools/reasoning_effort conflict)
#   that would otherwise have required patching every request. See notes/phase0.md.
#
# Prices: $ per million tokens, read from OpenRouter's /api/v1/models endpoint on
#   2026-10-08. They matched the providers' own published first-party prices exactly on
#   that date. Not hand-entered from memory. Re-verify before quoting in the paper.
#
# Model IDs: OpenRouter uses DOT notation for Anthropic (claude-sonnet-5.5), not the
#   dash notation of the first-party API (claude-sonnet-5-5). Both forms are recorded so
#   the paper can cite the underlying first-party model.

route:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  prices_fetched: 2026-10-08
  # OpenRouter enforces a server-side spend ceiling on this key, which matches the
  # author's cap exactly. Verified via GET /api/v1/key on 2026-10-08:
  #   limit: 50 USD, limit_remaining: 50 USD, usage: 0
  # The key also carries expires_at: 2026-11-06. Runs must finish before then.
  spend_cap_usd: 50
  key_expires: 2026-11-06

agents:
  - name: sonnet-5.5
    id: anthropic/claude-sonnet-5.5
    first_party_id: claude-sonnet-5-5
    family: anthropic          # used to tag judgments same-family vs cross-family
    tier: mid
    price_in: 2.00
    price_out: 10.00
    price_cache_read: 0.10
    context: 1000000

  - name: haiku-5.5
    id: anthropic/claude-haiku-5.5
    first_party_id: claude-haiku-5-5
    family: anthropic
    tier: small
    price_in: 0.10
    price_out: 0.50
    price_cache_read: 0.01
    context: 1000000
    # Tiered: these rates apply to prompts up to 100,000 tokens. Above that the rates
    # become 0.50 / 2.50 / 0.05. The ReAct loop re-sends the whole trajectory each step
    # and the benchmark's tool-output truncation is commented out, so long runs can cross
    # the threshold. The cost tracker must bill per-call on measured prompt_tokens, not
    # on a flat assumed rate.
    price_in_over_100k: 0.50
    price_out_over_100k: 2.50
    price_cache_read_over_100k: 0.05

  - name: gpt-6-sol
    id: openai/gpt-6-sol
    first_party_id: gpt-6-sol
    family: openai
    tier: mid
    price_in: 2.00
    price_out: 10.00
    price_cache_read: 0.20
    context: 1050000

  - name: gpt-6-luna
    id: openai/gpt-6-luna
    first_party_id: gpt-6-luna
    family: openai
    tier: small
    price_in: 0.10
    price_out: 0.50
    price_cache_read: 0.01
    context: 1050000

judges:
  # Neither judge is also an agent, so no judgment is ever same-MODEL. Same-FAMILY
  # judgments are unavoidable with only two providers; every judge-dependent result is
  # reported twice, once over all judgments and once over cross-family judgments only.
  - name: opus-5.5
    id: anthropic/claude-opus-5.5
    first_party_id: claude-opus-5-5
    family: anthropic
    price_in: 4.00
    price_out: 20.00
    price_cache_read: 0.20
    context: 1000000
    # Batch variant is exactly half price and judging is not latency-sensitive, so this
    # is the main budget lever if the measured estimate overruns.
    batch_id: anthropic/claude-opus-5.5:batch
    batch_price_in: 2.00
    batch_price_out: 10.00

  - name: gpt-6.1-sol
    id: openai/gpt-6.1-sol
    first_party_id: gpt-6.1-sol
    family: openai
    price_in: 2.00
    price_out: 10.00
    price_cache_read: 0.10
    context: 1050000

# Author's decision: run the reasoning-on / reasoning-off comparison ("both modes").
#
# CORRECTED 2026-10-08 after measurement. An earlier version of this file defined "off"
# as *omitting* the reasoning parameter. That was wrong: these models reason adaptively
# by default, so omitting the parameter leaves reasoning ON. The first smoke-test run
# labelled "off" spent 1618 reasoning tokens. Comparing "omit" against "effort: medium"
# would have compared two reasoning-on conditions and measured nothing. The two smoke
# traces produced under the old labels are therefore discarded rather than relabelled.
#
# Measured behaviour on a prompt hard enough to trigger thinking (2026-10-08):
#
#   model          omit param      enabled:false        effort:medium
#   haiku-5.5      314 r-tokens    0 r-tokens           347 r-tokens
#   sonnet-5.5     171 r-tokens    ERROR (see below)    0 r-tokens
#   gpt-6-luna      17 r-tokens    0 r-tokens            18 r-tokens
#
# claude-sonnet-5.5 REFUSES to disable reasoning:
#   "Reasoning is mandatory for this endpoint and cannot be disabled."
# The first-party Models API agrees for haiku (capabilities.thinking.types.disabled
# .supported == true) and this is consistent with Anthropic's published lineup, where
# Opus/Fable are "adaptive (always on)" and Sonnet/Haiku are "adaptive".
#
# Consequence, to be stated in the limitations: the reasoning on/off comparison CANNOT
# be run on sonnet-5.5. It is available on haiku-5.5, gpt-6-sol and gpt-6-luna only.
reasoning_modes:
  # Keys MUST stay quoted. Unquoted `off:`/`on:` are parsed as the booleans False/True
  # under YAML 1.1, which silently renames these modes.
  "off":
    params:
      reasoning:
        enabled: false
    # Not available on every model; the runner must refuse rather than silently fall back.
    unsupported_models: [sonnet-5.5]
  "on":
    params:
      reasoning:
        effort: medium
    unsupported_models: []
  # Which model carries the comparison arm is still deferred to the measured cost
  # estimate, but it must be one of haiku-5.5 / gpt-6-sol / gpt-6-luna.
  comparison_arm: PENDING_COST_ESTIMATE

sampling:
  # The benchmark documents temperature 0 / deterministic as its default. That is NOT
  # achievable and NOT silently assumed. Measured on 2026-10-08, four identical
  # temperature=0 requests per model:
  #   anthropic/claude-haiku-5.5 -> 'Varnholt', 'Valkenburg', 'Varnhold', 'Varnhollow'
  #   openai/gpt-6-luna          -> 'Veyrlock', 'Veycroft', 'Veycroft', 'Veycroft'
  # OpenRouter ACCEPTS temperature=0 without error but the provider does not apply it
  # (the first-party APIs reject the value outright: "Only the default (1) value is
  # supported"). So runs are SAMPLED, not greedy. This is why the 3 repetitions matter.
  temperature: null          # deliberately unset; sending 0 would be a false claim
  deterministic: false
  max_steps: 50              # benchmark default, unchanged
  bash_timeout_s: 30         # benchmark default, enforced server-side, unchanged
  # Do not set a small max_tokens. Measured: gpt-6-luna spent all 16 completion tokens of
  # a 12-token budget on reasoning and returned content: null with
  # finish_reason: length. The benchmark sets no max_tokens, which is the safe default.
  max_tokens: null
