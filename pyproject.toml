[project]
name = "caaef-experiment"
version = "0.1.0"
description = "Empirical study for the CAAEF paper, on ODCV-Bench"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "numpy==2.2.1",
  "scipy==1.15.1",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "matplotlib==3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caaef"]
